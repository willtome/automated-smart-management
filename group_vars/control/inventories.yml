    inventory: Workshop Inventory
    credential: Inventory Credential
    source: satellite6
    source_vars:
      keyed_groups:
        - prefix: env
          key: foreman_content_facet_attributes.lifecycle_environment_name
        - prefix: cv
          key: foreman_content_facet_attributes.content_view_name
