---
tower_templates:
  - name: SERVER / Register
    project: Automated Management
    playbook: server_register.yml
    inventory: Workshop Inventory
    credentials:
      - Workshop Credential
    extra_vars:
      org_id: "Default Organization"
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Server Name or Pattern
          type: text
          variable: PREFIX
          required: false
  - name: Satellite / Publish Content View
    project: Automated Management
    playbook: satellite_publish.yml
    inventory: Workshop Inventory
    credentials:
      - Satellite Credential
    extra_vars:
      organization: "Default Organization"
      lifecycle_environment: "{%raw%}{{ content_view }}_Dev{%endraw%}"
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select Content View
          variable: content_view
          type: multiplechoice
          choices: "{{ hostvars['satellite.example.com']['foreman_content_views'] | map(attribute='name') | list}}"
          required: true
  - name: Satellite / Promote Content View
    project: Automated Management
    playbook: satellite_promote.yml
    inventory: Workshop Inventory
    credentials:
      - Satellite Credential
    extra_vars:
      organization: "Default Organization"
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select Content View
          variable: content_view
          type: multiplechoice
          choices: "{{ hostvars['satellite.example.com']['foreman_content_views'] | map(attribute='name') | list}}"
          required: true
        - question_name: Current Lifecycle Environment
          variable: current_lifecycle_environment
          type: multiplechoice
          choices: "{{ hostvars['satellite.example.com']['lifecycle_environments'] | map(attribute='name') | list}}"
          required: true
        - question_name: Next Lifecycle Environment
          variable: lifecycle_environment
          type: multiplechoice
          choices: "{{ hostvars['satellite.example.com']['lifecycle_environments'] | map(attribute='name') | list}}"
          required: true
  - name: Server / Patch
    project: Automated Management
    playbook: server_patch.yml
    inventory: Workshop Inventory
    use_fact_cache: true
    credentials:
      - Workshop Credential
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select Environment
          type: multiplechoice
          variable: server_type
          choices: "{{ hostvars['satellite.example.com']['lifecycle_environments'] | map(attribute='name') | list}}"
          required: true
        - question_name: Check
          type: multiplechoice
          variable: check_only
          choices:
            - 'yes'
            - 'no'
          required: true